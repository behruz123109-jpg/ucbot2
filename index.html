<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>UC Bot — PUBG Mobile UC Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0e12; --bg2:#11151b; --card:#161b22; --card2:#1d232c;
  --gold:#f5a623; --gold2:#ffcf6b; --orange:#ff6a1a;
  --text:#eef1f5; --muted:#8892a0; --line:#232b36;
  --green:#3ddc84; --red:#ff4d4f; --blue:#4da3ff;
  --radius:14px;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:
    radial-gradient(1200px 500px at 50% -10%, rgba(245,166,35,.12), transparent 60%),
    linear-gradient(180deg, var(--bg2), var(--bg));
  color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100%; overflow-x:hidden;
}
.app{max-width:560px; margin:0 auto; padding:14px 14px calc(84px + env(safe-area-inset-bottom,0px)); min-height:100vh;}

/* ===== TOP BAR (PUBG style) ===== */
.topbar{
  position:relative; border-radius:var(--radius); padding:16px 16px 14px;
  background:linear-gradient(135deg, #1a2029 0%, #10141a 100%);
  border:1px solid var(--line); overflow:hidden; margin-bottom:14px;
}
.topbar::before{
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(115deg, rgba(245,166,35,.06) 0 10px, transparent 10px 26px);
  pointer-events:none;
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-badge{
  width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:22px; background:linear-gradient(135deg,var(--gold),var(--orange)); box-shadow:0 4px 14px rgba(245,166,35,.35);
}
.brand-name{font-weight:800; font-size:15px; letter-spacing:.5px; text-transform:uppercase;}
.brand-sub{font-size:11px; color:var(--muted);}
.vip-chip{
  font-size:11px; font-weight:800; padding:4px 9px; border-radius:20px; letter-spacing:.5px;
  background:linear-gradient(135deg,var(--gold),var(--orange)); color:#1a1200;
}
.stats-row{display:flex; gap:8px; margin-top:14px; position:relative; z-index:1;}
.stat-pill{
  flex:1; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px;
  padding:9px 10px; text-align:center;
}
.stat-pill .v{font-weight:800; font-size:15px;}
.stat-pill .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
.stat-pill.gold .v{color:var(--gold2);}

/* ===== TABS CONTENT ===== */
.section{display:none; animation:fade .2s ease;}
.section.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
.h2{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:18px 2px 10px;}
.h2:first-child{margin-top:2px;}

/* ===== SHOP GRID ===== */
.pkg-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.pkg-card{
  position:relative; background:linear-gradient(160deg, var(--card2), var(--card));
  border:1px solid var(--line); border-radius:var(--radius); padding:14px 12px; cursor:pointer;
  transition:transform .12s ease, border-color .12s ease;
}
.pkg-card:active{transform:scale(.97); border-color:var(--gold);}
.pkg-uc{font-size:20px; font-weight:900; color:var(--gold2); display:flex; align-items:center; gap:5px;}
.pkg-uc small{font-size:12px; color:var(--muted); font-weight:600;}
.pkg-name{font-size:12px; color:var(--muted); margin-top:2px;}
.pkg-price{
  margin-top:10px; font-weight:800; font-size:14px; background:rgba(245,166,35,.12); color:var(--gold2);
  border-radius:8px; padding:6px 8px; text-align:center;
}
.empty{text-align:center; padding:40px 10px; color:var(--muted); font-size:13px;}

/* ===== CARDS / LISTS ===== */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
.order-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.order-code{font-weight:800; letter-spacing:.3px;}
.order-meta{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.5;}
.badge{font-size:10px; font-weight:800; padding:4px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap;}
.badge.wait{background:rgba(255,193,7,.15); color:#ffc107;}
.badge.check{background:rgba(77,163,255,.15); color:var(--blue);}
.badge.done{background:rgba(61,220,132,.15); color:var(--green);}
.badge.cancel{background:rgba(255,77,79,.15); color:var(--red);}
.mini-btn{
  margin-top:8px; font-size:11px; font-weight:700; padding:6px 10px; border-radius:8px; border:1px solid var(--line);
  background:transparent; color:var(--red); cursor:pointer;
}

/* ===== BUTTONS ===== */
.btn{
  display:block; width:100%; text-align:center; border:none; border-radius:12px; padding:13px;
  font-weight:800; font-size:14px; letter-spacing:.3px; cursor:pointer; text-transform:uppercase;
}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--orange)); color:#1a1200; box-shadow:0 6px 18px rgba(245,166,35,.28);}
.btn-outline{background:transparent; border:1px solid var(--line); color:var(--text);}
.btn-blue{background:linear-gradient(135deg,#4da3ff,#2f6fe0); color:#fff;}
.btn:disabled{opacity:.5; pointer-events:none;}
.btn-row{display:flex; gap:8px; margin-top:10px;}
.btn-row .btn{flex:1;}

/* ===== FORM ===== */
.field{margin-bottom:12px;}
.field label{font-size:12px; color:var(--muted); font-weight:700; display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.3px;}
.field input{
  width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:12px 12px;
  color:var(--text); font-size:15px; outline:none;
}
.field input:focus{border-color:var(--gold);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:12px;}
.switch{width:42px; height:24px; border-radius:20px; background:#2a3340; position:relative; cursor:pointer; transition:.15s;}
.switch.on{background:linear-gradient(135deg,var(--gold),var(--orange));}
.switch .dot{position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s;}
.switch.on .dot{left:21px;}

/* ===== MODAL / SHEET ===== */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:50;}
.overlay.show{display:flex;}
.sheet{
  width:100%; max-width:560px; margin:0 auto; background:var(--bg2); border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px)); max-height:86vh; overflow-y:auto;
  border-top:1px solid var(--line); animation:up .18s ease;
}
@keyframes up{from{transform:translateY(30px); opacity:0;} to{transform:none; opacity:1;}}
.sheet-handle{width:36px; height:4px; border-radius:3px; background:var(--line); margin:0 auto 14px;}
.sheet-title{font-size:16px; font-weight:800; margin-bottom:14px;}
.summary-row{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:var(--muted);}
.summary-row b{color:var(--text);}
.summary-total{display:flex; justify-content:space-between; font-size:17px; font-weight:900; color:var(--gold2); padding-top:10px; margin-top:6px; border-top:1px dashed var(--line);}
.pay-info{background:var(--card); border:1px dashed var(--gold); border-radius:12px; padding:14px; text-align:center; margin-top:6px;}
.pay-code{font-size:26px; font-weight:900; color:var(--gold2); letter-spacing:1px; margin:8px 0;}
.pay-card-num{font-size:17px; font-weight:800; letter-spacing:1px; margin-top:6px;}
.toast{
  position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:#1d232c; border:1px solid var(--line);
  padding:11px 18px; border-radius:30px; font-size:13px; font-weight:600; z-index:100; opacity:0; transition:.2s; max-width:88%; text-align:center;
}
.toast.show{opacity:1; bottom:112px;}
.toast.err{border-color:var(--red); color:#ffb3b4;}
.toast.ok{border-color:var(--green); color:#b7f5cf;}

/* ===== LEADERBOARD ===== */
.lb-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.lb-row:last-child{border-bottom:none;}
.lb-rank{width:26px; text-align:center; font-weight:900; color:var(--muted);}
.lb-row:nth-child(1) .lb-rank{color:#ffd700;}
.lb-row:nth-child(2) .lb-rank{color:#c0c0c0;}
.lb-row:nth-child(3) .lb-rank{color:#cd7f32;}
.lb-name{flex:1; font-weight:700; font-size:13px;}
.lb-uc{font-weight:800; color:var(--gold2); font-size:13px;}

/* ===== BOTTOM NAV ===== */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:rgba(17,21,27,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line);
  padding:8px 6px calc(6px + env(safe-area-inset-bottom,0px));
}
.nav-inner{max-width:560px; margin:0 auto; display:flex;}
.nav-btn{
  flex:1; background:none; border:none; color:var(--muted); font-size:10px; font-weight:700; text-transform:uppercase;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; cursor:pointer; letter-spacing:.3px;
}
.nav-btn .ic{font-size:19px;}
.nav-btn.active{color:var(--gold2);}

.copy-hint{font-size:11px; color:var(--muted); margin-top:4px;}
.ref-box{display:flex; gap:8px; align-items:center; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12px; word-break:break-all; color:var(--gold2);}
.loader{display:flex; justify-content:center; padding:30px; color:var(--muted); font-size:13px;}
</style>
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-badge">🎮</div>
        <div>
          <div class="brand-name">Pro UC Bot</div>
          <div class="brand-sub" id="userName">Yuklanmoqda...</div>
        </div>
      </div>
      <div id="vipChip" style="display:none" class="vip-chip">💎 VIP</div>
    </div>
    <div class="stats-row">
      <div class="stat-pill gold"><div class="v" id="statBalance">0</div><div class="l">so'm</div></div>
      <div class="stat-pill gold"><div class="v" id="statCoins">0 🪙</div><div class="l">tanga</div></div>
      <div class="stat-pill"><div class="v" id="statUC">0</div><div class="l">jami UC</div></div>
    </div>
  </div>

  <!-- SHOP -->
  <section class="section active" id="sec-shop">
    <div class="h2">💎 UC Paketlari</div>
    <div class="pkg-grid" id="pkgGrid"><div class="loader">⏳ Yuklanmoqda...</div></div>
  </section>

  <!-- PROFILE -->
  <section class="section" id="sec-profile">
    <div class="h2">👤 Profil</div>
    <div class="card" id="profileCard"></div>
    <div class="h2">🎁 Kunlik bonus</div>
    <div class="card">
      <button class="btn btn-gold" id="btnDaily">🎁 Bonusni olish</button>
    </div>
    <div class="h2">👥 Referal havola</div>
    <div class="card">
      <div class="ref-box" id="refLink">yuklanmoqda...</div>
      <div class="btn-row">
        <button class="btn btn-outline" id="btnCopyRef">📋 Nusxalash</button>
        <button class="btn btn-blue" id="btnShareRef">📤 Ulashish</button>
      </div>
    </div>
  </section>

  <!-- ORDERS -->
  <section class="section" id="sec-orders">
    <div class="h2">📦 Buyurtmalarim</div>
    <div id="ordersList"><div class="loader">⏳ Yuklanmoqda...</div></div>
  </section>

  <!-- COINS -->
  <section class="section" id="sec-coins">
    <div class="h2">🪙 Tangalarni almashtirish</div>
    <div class="card">
      <div class="field"><label>Nechta tangani so'mga almashtiramiz?</label><input type="number" id="exchAmount" placeholder="Masalan: 50"></div>
      <button class="btn btn-gold" id="btnExchange">🔄 Almashtirish</button>
    </div>
    <div class="h2">🛍 Tanga sotib olish</div>
    <div class="card">
      <div class="field"><label>Nechta tanga sotib olamiz?</label><input type="number" id="buyAmount" placeholder="Masalan: 20"></div>
      <button class="btn btn-blue" id="btnBuyCoin">🛍 Sotib olish</button>
    </div>
  </section>

  <!-- RATING -->
  <section class="section" id="sec-rating">
    <div class="h2">🏆 TOP-10 xaridorlar</div>
    <div class="card" id="lbList"><div class="loader">⏳ Yuklanmoqda...</div></div>
  </section>

</div>

<!-- BOTTOM NAV -->
<div class="nav">
  <div class="nav-inner">
    <button class="nav-btn active" data-tab="shop"><span class="ic">🛒</span>Do'kon</button>
    <button class="nav-btn" data-tab="orders"><span class="ic">📦</span>Buyurtma</button>
    <button class="nav-btn" data-tab="coins"><span class="ic">🪙</span>Tanga</button>
    <button class="nav-btn" data-tab="rating"><span class="ic">🏆</span>Reyting</button>
    <button class="nav-btn" data-tab="profile"><span class="ic">👤</span>Profil</button>
  </div>
</div>

<!-- CHECKOUT SHEET -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
try{ tg?.setHeaderColor('#0b0e12'); tg?.setBackgroundColor('#0b0e12'); }catch(e){}

const initData = tg?.initData || "";
let STATE = { profile:null, settings:null, packages:[], selectedPkg:null };

function toast(msg, type=''){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(()=>t.className='toast '+type, 2400);
}
function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

async function api(path, opts={}){
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: {'Content-Type':'application/json', 'X-Init-Data': initData},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  let json;
  try{ json = await res.json(); }catch(e){ json = {ok:false, error:'Server javobi xato'}; }
  if(!json.ok){ toast(json.error || 'Xatolik yuz berdi', 'err'); throw new Error(json.error); }
  return json.data;
}

/* ===== NAV ===== */
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-'+btn.dataset.tab).classList.add('active');
    tg?.HapticFeedback?.impactOccurred('light');
    if(btn.dataset.tab==='orders') loadOrders();
    if(btn.dataset.tab==='rating') loadLeaderboard();
    if(btn.dataset.tab==='profile') loadProfile();
  };
});

/* ===== PROFILE / TOPBAR ===== */
async function loadProfile(){
  const p = await api('/api/profile');
  STATE.profile = p;
  document.getElementById('userName').textContent = p.full_name + (p.is_admin ? ' • Admin' : '');
  document.getElementById('statBalance').textContent = fmt(p.balance);
  document.getElementById('statCoins').textContent = fmt(p.coins)+' 🪙';
  document.getElementById('statUC').textContent = fmt(p.total_uc);
  document.getElementById('vipChip').style.display = p.is_vip ? 'block' : 'none';

  const vipLine = p.is_vip
    ? '💎 <b>VIP maqom faol!</b> Keshbek ×2 va oylik TOP-1 o\'yinida ishtirok.'
    : `VIP maqom uchun yana <b>${fmt(p.vip_remaining)} UC</b> kerak.`;
  document.getElementById('profileCard').innerHTML = `
    <div class="order-row"><div>🆔 ID</div><b>${p.id}</b></div>
    <div class="order-row" style="margin-top:8px"><div>💰 Balans</div><b>${fmt(p.balance)} so'm</b></div>
    <div class="order-row" style="margin-top:8px"><div>🪙 Tangalar</div><b>${fmt(p.coins)}</b></div>
    <div class="order-row" style="margin-top:8px"><div>💎 Jami xarid</div><b>${fmt(p.total_uc)} UC</b></div>
    <div class="order-row" style="margin-top:8px"><div>👥 Takliflar</div><b>${p.referrals}</b></div>
    <div style="margin-top:12px; font-size:12px; color:var(--muted)">${vipLine}</div>
  `;
  const me = await getBotUsername();
  document.getElementById('refLink').textContent = `https://t.me/${me}?start=ref_${p.id}`;
}

let _botUsername = null;
async function getBotUsername(){
  if(_botUsername) return _botUsername;
  _botUsername = tg?.initDataUnsafe?.receiver?.username || (window.__BOT_USERNAME__ || 'your_bot');
  return _botUsername;
}

document.getElementById('btnDaily').onclick = async ()=>{
  try{
    const r = await api('/api/daily', {method:'POST'});
    toast(`🎁 +${r.bonus} tanga olindi!`, 'ok');
    tg?.HapticFeedback?.notificationOccurred('success');
    loadProfile();
  }catch(e){}
};
document.getElementById('btnCopyRef').onclick = ()=>{
  const link = document.getElementById('refLink').textContent;
  navigator.clipboard?.writeText(link).then(()=>toast('📋 Nusxalandi!','ok'));
};
document.getElementById('btnShareRef').onclick = ()=>{
  const link = document.getElementById('refLink').textContent;
  tg?.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('💎 Pro UC Bot orqali PUBG UC sotib oling!')}`);
};

/* ===== SHOP ===== */
async function loadPackages(){
  const pk = await api('/api/packages');
  STATE.packages = pk;
  const grid = document.getElementById('pkgGrid');
  if(!pk.length){ grid.innerHTML = '<div class="empty">😔 Hozircha paketlar mavjud emas</div>'; return; }
  grid.innerHTML = pk.map(p=>`
    <div class="pkg-card" onclick="openCheckout(${p.id})">
      <div class="pkg-uc">💎 ${fmt(p.uc)} <small>UC</small></div>
      <div class="pkg-name">${p.name}</div>
      <div class="pkg-price">${fmt(p.price)} so'm</div>
    </div>`).join('');
}

function openSheet(html){
  document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div>` + html;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

let CHECKOUT = { pkg:null, pubgId:'', code:'', useCoins:false };

window.openCheckout = function(pkgId){
  const pkg = STATE.packages.find(p=>p.id===pkgId);
  CHECKOUT = { pkg, pubgId:'', code:'', useCoins:false };
  tg?.HapticFeedback?.impactOccurred('medium');
  renderCheckoutForm();
};

function renderCheckoutForm(){
  const p = CHECKOUT.pkg;
  openSheet(`
    <div class="sheet-title">🛒 ${p.name} — ${fmt(p.uc)} UC</div>
    <div class="field"><label>🎮 PUBG Mobile ID</label>
      <input type="tel" id="inpPubg" placeholder="Masalan: 5123456789" value="${CHECKOUT.pubgId}"></div>
    <div class="field"><label>🎟 Kupon kodi (ixtiyoriy)</label>
      <input type="text" id="inpCoupon" placeholder="Masalan: PUBG2026" value="${CHECKOUT.code}"></div>
    <div class="toggle-row" id="coinToggleRow">
      <span>🪙 Tangalardan foydalanish</span>
      <div class="switch ${CHECKOUT.useCoins?'on':''}" id="coinSwitch"><div class="dot"></div></div>
    </div>
    <div id="quoteBox"></div>
    <div class="btn-row">
      <button class="btn btn-gold" id="btnPayBalance">💰 Balansdan to'lash</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-blue" id="btnPayCard">💳 Karta orqali to'lash</button>
    </div>
  `);
  document.getElementById('inpPubg').oninput = e=>{ CHECKOUT.pubgId = e.target.value.trim(); };
  document.getElementById('inpCoupon').oninput = debounce(e=>{ CHECKOUT.code = e.target.value.trim(); refreshQuote(); }, 400);
  document.getElementById('coinSwitch').onclick = ()=>{
    CHECKOUT.useCoins = !CHECKOUT.useCoins;
    document.getElementById('coinSwitch').classList.toggle('on', CHECKOUT.useCoins);
    refreshQuote();
  };
  document.getElementById('btnPayBalance').onclick = ()=>submitOrder('balance');
  document.getElementById('btnPayCard').onclick = ()=>submitOrder('card');
  refreshQuote();
}

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

async function refreshQuote(){
  const box = document.getElementById('quoteBox');
  if(!box) return;
  try{
    const q = await api('/api/quote', {method:'POST', body:{
      pkg_id: CHECKOUT.pkg.id, code: CHECKOUT.code || null, use_coins: CHECKOUT.useCoins
    }});
    let rows = `<div class="summary-row"><span>Narx</span><b>${fmt(q.price)} so'm</b></div>`;
    if(q.coupon_error) rows += `<div class="summary-row" style="color:var(--red)"><span>🎟 Kupon</span><b>${q.coupon_error}</b></div>`;
    else if(q.coupon_disc) rows += `<div class="summary-row"><span>🎟 Kupon chegirmasi</span><b>−${fmt(q.coupon_disc)} so'm</b></div>`;
    if(q.coin_used) rows += `<div class="summary-row"><span>🪙 Tanga (${q.coin_used} ta)</span><b>−${fmt(q.coin_disc)} so'm</b></div>`;
    rows += `<div class="summary-total"><span>Jami to'lov</span><span>${fmt(q.final)} so'm</span></div>`;
    rows += `<div class="copy-hint">💰 Balansingiz: ${fmt(q.balance)} so'm • 🪙 ${fmt(q.coins)} tanga</div>`;
    box.innerHTML = rows;
  }catch(e){ box.innerHTML = ''; }
}

async function submitOrder(method){
  if(!(CHECKOUT.pubgId.length>=7 && CHECKOUT.pubgId.length<=12 && /^\d+$/.test(CHECKOUT.pubgId))){
    toast('❗️ PUBG ID noto\\'g\\'ri (7-12 raqam)', 'err'); return;
  }
  try{
    const r = await api('/api/order/create', {method:'POST', body:{
      pkg_id: CHECKOUT.pkg.id, pubg_id: CHECKOUT.pubgId, code: CHECKOUT.code || null,
      use_coins: CHECKOUT.useCoins, method
    }});
    tg?.HapticFeedback?.notificationOccurred('success');
    if(method === 'balance'){
      openSheet(`
        <div class="sheet-title">✅ Buyurtma qabul qilindi!</div>
        <div class="pay-info">
          <div>Buyurtma kodi</div><div class="pay-code">${r.code}</div>
          <div style="color:var(--muted); font-size:12px">To'lov balansdan yechildi. UC tez orada PUBG ID ga yuboriladi.</div>
        </div>
        <div class="btn-row"><button class="btn btn-gold" onclick="closeSheet()">Yopish</button></div>
      `);
    } else {
      openSheet(`
        <div class="sheet-title">💳 To'lovni amalga oshiring</div>
        <div class="pay-info">
          <div style="font-size:12px; color:var(--muted)">Karta raqami</div>
          <div class="pay-card-num">${r.card_number}</div>
          <div style="font-size:12px; margin-top:4px">${r.card_owner}</div>
          <div style="font-size:12px; color:var(--muted); margin-top:10px">To'lov izohiga yozing</div>
          <div class="pay-code">${r.code}</div>
          <div style="font-size:16px; font-weight:800; color:var(--gold2)">${fmt(r.final)} so'm</div>
        </div>
        <div class="copy-hint" style="text-align:center; margin-top:10px">📸 To'lagach, chek skrinshotini botga (chatga) yuboring — bot avtomatik qabul qiladi.</div>
        <div class="btn-row">
          <button class="btn btn-outline" id="btnCopyCard">📋 Karta raqamini nusxalash</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-gold" id="btnGoChat">💬 Botga qaytish (chek yuborish)</button>
        </div>
      `);
      document.getElementById('btnCopyCard').onclick = ()=>{
        navigator.clipboard?.writeText(r.card_number.replace(/\\s/g,'')).then(()=>toast('📋 Nusxalandi!','ok'));
      };
      document.getElementById('btnGoChat').onclick = ()=>{ tg?.close(); };
    }
    loadProfile();
  }catch(e){}
}

/* ===== ORDERS ===== */
const STATUS_MAP = {
  awaiting_check:['⏳ To\\'lov kutilmoqda','wait'], checking:['🔎 Tekshirilmoqda','check'],
  done:['✅ Bajarildi','done'], cancelled:['❌ Bekor qilindi','cancel']
};
async function loadOrders(){
  const list = document.getElementById('ordersList');
  const rows = await api('/api/orders');
  if(!rows.length){ list.innerHTML = '<div class="empty">📦 Sizda hali buyurtmalar yo\\'q</div>'; return; }
  list.innerHTML = rows.map(o=>{
    const [txt, cls] = STATUS_MAP[o.status] || ['—',''];
    const cancelBtn = o.status==='awaiting_check' ? `<button class="mini-btn" onclick="cancelOrder(${o.id})">✖️ Bekor qilish</button>` : '';
    return `<div class="card">
      <div class="order-row">
        <div><div class="order-code">${o.code}</div>
          <div class="order-meta">💎 ${o.pkg_name} • ${fmt(o.uc)} UC<br>💵 ${fmt(o.final)} so'm • 🎮 ${o.pubg_id}<br>🕒 ${o.created_at}</div>
        </div>
        <span class="badge ${cls}">${txt}</span>
      </div>
      ${cancelBtn}
    </div>`;
  }).join('');
}
window.cancelOrder = async function(id){
  try{ await api('/api/order/cancel', {method:'POST', body:{order_id:id}}); toast('✅ Bekor qilindi','ok'); loadOrders(); loadProfile(); }catch(e){}
};

/* ===== COINS ===== */
document.getElementById('btnExchange').onclick = async ()=>{
  const n = parseInt(document.getElementById('exchAmount').value);
  if(!n || n<=0){ toast('❗️ Musbat son kiriting','err'); return; }
  try{ const r = await api('/api/coin/exchange', {method:'POST', body:{amount:n}});
    toast(`✅ ${r.exchanged} 🪙 → ${fmt(r.credited)} so'm`,'ok'); loadProfile(); }catch(e){}
};
document.getElementById('btnBuyCoin').onclick = async ()=>{
  const n = parseInt(document.getElementById('buyAmount').value);
  if(!n || n<=0){ toast('❗️ Musbat son kiriting','err'); return; }
  try{ const r = await api('/api/coin/buy', {method:'POST', body:{amount:n}});
    toast(`✅ ${r.bought} 🪙 sotib olindi`,'ok'); loadProfile(); }catch(e){}
};

/* ===== LEADERBOARD ===== */
async function loadLeaderboard(){
  const rows = await api('/api/leaderboard');
  const box = document.getElementById('lbList');
  if(!rows.length){ box.innerHTML = '<div class="empty">🏆 Hozircha reyting bo\\'sh</div>'; return; }
  const medals = ['🥇','🥈','🥉'];
  box.innerHTML = rows.map((r,i)=>`
    <div class="lb-row">
      <div class="lb-rank">${medals[i]||(i+1)}</div>
      <div class="lb-name">${r.full_name}${r.is_vip?' 💎':''}</div>
      <div class="lb-uc">${fmt(r.total_uc)} UC</div>
    </div>`).join('');
}

    return;
  }
  try{
    await loadProfile();
    await loadPackages();
  }catch(e){ console.error(e); }
})();
</script>
